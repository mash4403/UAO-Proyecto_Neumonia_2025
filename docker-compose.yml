version: '3.8'

services:
  # Servicio para testing y desarrollo
  neumonia-detector:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    container_name: neumonia-detector
    volumes:
      # Montar código para desarrollo
      - .:/app
      # Montar datos si existen
      - ./data:/app/data:ro
      # Montar modelos si existen  
      - ./models:/app/models:ro
    environment:
      - PYTHONPATH=/app
      - MATPLOTLIB_BACKEND=Agg  # Backend sin GUI
    command: python -m pytest -v
    
  # Servicio para API web (futuro)
  api:
    build:
      context: .
      dockerfile: Dockerfile.optimized
    container_name: neumonia-api
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models:ro
      - ./data:/app/data:ro
    environment:
      - PYTHONPATH=/app
      - MATPLOTLIB_BACKEND=Agg
    # command: uvicorn api:app --host 0.0.0.0 --port 8000
    command: echo "API not implemented yet"
    profiles: ["api"]  # Solo ejecutar con --profile api
